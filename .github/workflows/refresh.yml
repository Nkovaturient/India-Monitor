name: Refresh India Monitor data

on:
  schedule:
    # 06:00 and 18:00 IST = 00:30 and 12:30 UTC.
    # (IST is UTC+5:30, so these land right after the morning news cycle
    # and again after markets close at 15:30 IST.)
    - cron: '30 0 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Ingest official sources (PIB + markets)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ingest.py

      - name: Synthesize timeline stations (grounded, Claude)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/synthesize.py

      # Nothing to commit — all data lives in Supabase, not the repo.
      # The site (GitHub Pages) reads live from Supabase on every page
      # load, so there is no rebuild/deploy step needed after this job.
