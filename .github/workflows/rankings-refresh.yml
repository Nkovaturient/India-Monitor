name: Refresh India Monitor rankings candidates

on:
  schedule:
    # 1st of each month, 01:00 UTC ≈ 06:30 IST — not the 2×/day news cron.
    - cron: '0 1 1 * *'
  workflow_dispatch: {}

jobs:
  rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check indexes in their release window
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/rankings_refresh.py
